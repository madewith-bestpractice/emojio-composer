        // Smart Random
        randomBtn.onclick = async () => {
            await initAudio();
            showModal("Create a new random song?", () => {
                snapshotForUndo();
                // Refresh Palette
                initPalette();

                state.notes = [];
                const numNotes = 12 + Math.floor(Math.random() * 8);
                const preferredCols = [0, 4, 8, 12];
                for(let i=0; i<numNotes; i++) {
                    let gx;
                    if (Math.random() < 0.6) {
                        gx = preferredCols[Math.floor(Math.random() * preferredCols.length)];
                    } else {
                        gx = Math.floor(Math.random() * GRID_COLS);
                    }
                    const gy = Math.floor(Math.random() * GRID_ROWS);
                    const emoji = state.palette[Math.floor(Math.random() * state.palette.length)];
                    if (!state.notes.find(n => n.gridX === gx && n.gridY === gy)) {
                        state.notes.push({ emoji, gridX: gx, gridY: gy, createdAt: Date.now() });
                    }
                }
                persist();
                announce(`Random song with ${state.notes.length} notes`);
                markDirty();
            });
        };

        // Canvas pointer logic — supports click-to-toggle AND drag-to-paint.
        // Drag-to-paint only ADDS notes (never deletes) to avoid the "I deleted my song
        // by sliding" failure mode.
        let isDragging = false;
        let lastPaintedKey = null;

        function hitTestGrid(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            if (x < staffPaddingLeft) return null;
            const gridX = Math.floor((x - staffPaddingLeft) / stepX);
            const rawY = (y - 40) / stepY;
            const gridY = Math.round(rawY);
            if (gridX < 0 || gridX >= GRID_COLS || gridY < 0 || gridY >= GRID_ROWS) return null;
            return { gridX, gridY };
        }

        function placeNote(gridX, gridY) {
            // Add only — used by drag painting
            const key = `${gridX},${gridY}`;
            if (key === lastPaintedKey) return false;
            lastPaintedKey = key;
            if (state.notes.find(n => n.gridX === gridX && n.gridY === gridY)) return false;
            if (typeof Tone !== "undefined" && foley.thunk) foley.thunk.triggerAttackRelease("C1", "16n");
            state.notes.push({
                emoji: state.selectedEmoji,
                gridX, gridY,
                isPressed: true,
                createdAt: 0
            });
            if (state.audioContextStarted && typeof Tone !== "undefined") {
                playNote({ emoji: state.selectedEmoji, gridX, gridY }, Tone.now());
            }
            return true;
        }

        canvas.addEventListener('pointerdown', async (e) => {
            e.preventDefault();
            await initAudio();

            const hit = hitTestGrid(e.clientX, e.clientY);
            if (!hit) return;

            // Snapshot for undo before any mutation in this gesture
            snapshotForUndo();

            const existingIndex = state.notes.findIndex(n => n.gridX === hit.gridX && n.gridY === hit.gridY);

            if (existingIndex > -1) {
                // Toggle delete on click
                if (typeof Tone !== "undefined" && foley.foop) foley.foop.triggerAttackRelease("C2", "8n");
                state.notes.splice(existingIndex, 1);
                announce("Note removed");
                lastPaintedKey = null;
            } else {
                lastPaintedKey = null; // reset so placeNote will place
                placeNote(hit.gridX, hit.gridY);
                announce(`Note placed at column ${hit.gridX + 1}`);
            }

            isDragging = true;
            // Capture the pointer so we keep getting move events even if the cursor leaves
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
            persist();
            markDirty();
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const hit = hitTestGrid(e.clientX, e.clientY);
            if (!hit) return;
            if (placeNote(hit.gridX, hit.gridY)) {
                persist();
                markDirty();
            }
        });

        const endDrag = (e) => {
            if (!isDragging) return;
            isDragging = false;
            lastPaintedKey = null;
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        canvas.addEventListener('pointerleave', endDrag);

        // --- STANDARD WIRING ---
        clearBtn.onclick = () => showModal("Delete all notes?", () => {
            snapshotForUndo();
            state.notes = [];
            persist();
            announce("All notes cleared");
            markDirty();
        });
        playToggle.onclick = async () => {
            await initAudio();
            if (state.isPlaying) {
                state.isPlaying = false;
                Tone.Transport.stop();
                
                playIcon.src = getEmojiUrl('▶️');
                playLabel.textContent = 'Play';
                playToggle.classList.remove('playing');
                state.currentStep = -1;
                markDirty(); 
            } else {
                state.isPlaying = true;
                Tone.Transport.start();

                playIcon.src = getEmojiUrl('⏹️');
                playLabel.textContent = 'Stop';
                playToggle.classList.add('playing');
                transportStep = 0;
                markDirty();
            }
        };
        openPickerBtn.onclick = async (e) => {
            e.stopPropagation();
            await initAudio();
            pickerPopover.classList.toggle('visible');
            if(pickerTabs.firstChild) pickerTabs.firstChild.focus();
        };
        
        // Add Plus icon to picker button
        const plusImg = document.createElement('img');
        plusImg.src = getEmojiUrl('➕');
        openPickerBtn.innerHTML = '';
        openPickerBtn.appendChild(plusImg);
        
        document.body.addEventListener('click', (e) => {
            if (!pickerPopover.contains(e.target) && !openPickerBtn.contains(e.target)) pickerPopover.classList.remove('visible');
            if (e.target.classList.contains('modal-overlay')) {
                shareModal.classList.add('hidden');
                modalOverlay.classList.add('hidden');
            }
        });
        // Keyboard shortcuts. Skip when typing in a text field (textarea/input).
        function isTyping(el) {
            if (!el) return false;
            const tag = el.tagName;
            if (tag === 'TEXTAREA') return true;
            if (tag === 'INPUT' && el.type !== 'range') return true;
            if (el.isContentEditable) return true;
            return false;
        }
        // Don't hijack Space/Enter when focus is on something that natively uses them.
        function isInteractiveTarget(el) {
            if (!el) return false;
            const tag = el.tagName;
            return tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                pickerPopover.classList.remove('visible');
                hideModal();
                closeShareModal();
                return;
            }

            if (isTyping(e.target)) return;

            // Cmd/Ctrl+Z — undo (always available outside text fields)
            if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
                e.preventDefault();
                undo();
                return;
            }

            // Space — toggle play. Skip if focus is on a button so Space activates the button.
            if ((e.key === ' ' || e.code === 'Space') && !isInteractiveTarget(e.target)) {
                e.preventDefault();
                playToggle.click();
                return;
            }

            // Delete — clear (with confirm). Skip if focus is on an interactive control.
            if (e.key === 'Delete' && !isInteractiveTarget(e.target)) {
                e.preventDefault();
                clearBtn.click();
                return;
            }
        });
        tempoInput.oninput = (e) => {
            state.bpm = Number(e.target.value);
            tempoInput.setAttribute('aria-valuenow', String(state.bpm));
            if (typeof Tone !== "undefined" && Tone.Transport) {
                if (Tone.Transport.state !== "stopped") {
                    Tone.Transport.bpm.rampTo(state.bpm, 0.05);
                } else {
                    Tone.Transport.bpm.value = state.bpm;
                }
            }
            persist();
        };

        // --- PICKER GENERATION ---
        function buildPicker() {
            pickerTabs.innerHTML = '';
            pickerContent.innerHTML = '';
            let firstCat = true;

            for (const [category, emojis] of Object.entries(CATEGORIES)) {
                const icon = category.match(/[\p{Emoji}\u200d]+/u)?.[0] || category[0];
                const catId = category.replace(/[^a-zA-Z]/g, '');

                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'picker-tab';
                if (firstCat) tab.classList.add('active');
                tab.setAttribute('aria-label', category);
                tab.setAttribute('aria-pressed', firstCat ? 'true' : 'false');

                const tabImg = document.createElement('img');
                tabImg.alt = "";
                tabImg.src = getEmojiUrl(icon);
                tab.appendChild(tabImg);

                tab.title = category;

                tab.onclick = () => {
                    document.querySelectorAll('.picker-tab').forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-pressed', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-pressed', 'true');
                    document.querySelectorAll('.picker-section').forEach(s => s.classList.add('hidden'));
                    document.getElementById('sec-' + catId).classList.remove('hidden');
                };
                pickerTabs.appendChild(tab);

                const section = document.createElement('div');
                section.className = 'picker-section';
                if (!firstCat) section.classList.add('hidden');
                section.id = 'sec-' + catId;
                
                const title = document.createElement('div');
                title.className = 'picker-section-title';
                title.textContent = category;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'picker-grid';

                emojis.forEach(char => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'picker-item';
                    item.setAttribute('aria-label', `Add ${char} to palette`);

                    const img = document.createElement('img');
                    img.loading = "lazy";
                    img.alt = "";
                    img.src = getEmojiUrl(char);
                    img.onerror = () => { img.style.display = 'none'; item.textContent = char; };

                    item.appendChild(img);
                    item.onmouseenter = () => playPreview(char);
                    item.onfocus = () => playPreview(char);
                    item.onclick = () => {
                        addToPalette(char);
                        pickerPopover.classList.remove('visible');
                    };
                    grid.appendChild(item);
                });

                section.appendChild(grid);
                pickerContent.appendChild(section);
                firstCat = false;
            }
        }

        // --- PALETTE MANAGEMENT ---
        function initPalette() {
            const shuffled = shuffle([...ALL_EMOJIS]);
            state.palette = shuffled.slice(0, 6);
            selectEmoji(state.palette[0]);
            renderPalette();
        }

        function addToPalette(char) {
            const idx = state.palette.indexOf(char);
            if (idx > -1) {
                state.palette.splice(idx, 1);
                state.palette.push(char);
            } else {
                if (state.palette.length >= 10) {
                    state.palette.shift(); 
                }
                state.palette.push(char);
            }
            selectEmoji(char);
            renderPalette();
        }

        function renderPalette() {
            const buttons = paletteContainer.querySelectorAll('.emoji-btn:not(#openPickerBtn)');
            buttons.forEach(b => b.remove());

            state.palette.forEach(char => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'emoji-btn';
                if (char === state.selectedEmoji) btn.classList.add('active');
                btn.setAttribute('aria-label', `Select ${char}`);
                btn.setAttribute('aria-pressed', char === state.selectedEmoji ? 'true' : 'false');

                const img = document.createElement('img');
                img.loading = "lazy";
                img.alt = "";
                img.src = getEmojiUrl(char);
                img.onerror = () => { img.style.display = 'none'; btn.textContent = char; };

                btn.appendChild(img);

                btn.onclick = () => {
                    playPreview(char);
                    selectEmoji(char);
                    document.querySelectorAll('.emoji-btn').forEach(b => {
                        b.classList.remove('active');
                        if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                };

                paletteContainer.insertBefore(btn, openPickerBtn);
            });
            state.palette.forEach(char => loadEmojiImage(char));
            persist();
        }

        function selectEmoji(char) {
            state.selectedEmoji = char;
            loadEmojiImage(char);
            updateCurrentEmojiDisplay(char);
            
            // Update Cursor Image
            customCursor.innerHTML = '';
            const cursorImg = document.createElement('img');
            cursorImg.src = getEmojiUrl(char);
            customCursor.appendChild(cursorImg);
        }

        function updateCurrentEmojiDisplay(char) {
            currentEmojiContainer.innerHTML = '';
            const img = document.createElement('img');
            img.src = getEmojiUrl(char);
            img.className = 'current-emoji-img';
            img.onerror = () => { currentEmojiContainer.textContent = char; };
            currentEmojiContainer.appendChild(img);
        }

        // --- INIT ---
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        if (typeof Tone !== "undefined" && Tone.Transport) {
             Tone.Transport.bpm.value = state.bpm;
        }
        buildPicker();
        initPalette();

        // Restore from URL hash > localStorage. URL hash wins because it's an explicit
        // share intent; localStorage is just "where you left off".
        function tryRestoreSong() {
            // 1. URL hash share — e.g. #s=BASE64
            const hash = location.hash || '';
            const m = hash.match(/^#?s=(.+)$/);
            if (m) {
                if (loadSongFromCode(decodeURIComponent(m[1]))) {
                    showToast("Loaded shared song!", "success");
                    return true;
                }
            }

            // 2. Persisted state
            const persisted = loadPersisted();
            if (persisted) {
                state.bpm = persisted.bpm || 100;
                tempoInput.value = state.bpm;
                tempoInput.setAttribute('aria-valuenow', String(state.bpm));
                if (typeof Tone !== "undefined" && Tone.Transport) {
                    Tone.Transport.bpm.value = state.bpm;
                }
                if (Array.isArray(persisted.palette) && persisted.palette.length) {
                    state.palette = persisted.palette;
                    renderPalette();
                }
                if (persisted.selectedEmoji && state.palette.includes(persisted.selectedEmoji)) {
                    selectEmoji(persisted.selectedEmoji);
                }
                state.notes = (persisted.notes || []).map(n => {
                    loadEmojiImage(n.emoji);
                    return { emoji: n.emoji, gridX: n.gridX, gridY: n.gridY, createdAt: Date.now() };
                });
                markDirty();
                return true;
            }
            return false;
        }
        tryRestoreSong();

        // Detect Tone.js CDN failure — defer means it loads after this script, so
        // wait for load+a beat and warn if still missing.
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (typeof Tone === "undefined") {
                    showToast("Audio engine couldn't load — check your connection.", "error");
                }
            }, 1500);
        });

        // Listen for hash changes (e.g. user pastes a link into the bar)
        window.addEventListener('hashchange', () => {
            const m = (location.hash || '').match(/^#?s=(.+)$/);
            if (m) loadSongFromCode(decodeURIComponent(m[1]));
        });

        startRenderLoop();

    </script>
</body>
</html>
