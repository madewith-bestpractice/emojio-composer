<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Emojio Paint Composer</title>
    <meta name="description" content="A playful emoji-stamp music composer. Paint sounds on a staff and share songs with a single link.">
    <meta name="theme-color" content="#81d4fa">
    <meta property="og:title" content="Emojio Paint Composer">
    <meta property="og:description" content="A playful emoji-stamp music composer. Paint sounds on a staff and share songs with a single link.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://emojio-composer.madewithbestpractice.com/emojio-icon.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Emojio Paint Composer">
    <meta name="twitter:description" content="Paint sounds on a staff and share songs with a single link.">

    <link rel="icon" type="image/png" href="emojio-icon.png">
    <link rel="apple-touch-icon" href="emojio-icon.png">

    <!-- Resource hints for the CDN's we depend on -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tone.js for Audio Synthesis (deferred so it doesn't block first paint) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
            integrity="sha384-c6Uo4N9c3SOEigMVzP6IshUG1wQ5uMp3xeoQFiHWAQ86joWdgyajkvopySyKy/Z6"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            defer></script>
    <!-- Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Toy Palette */
            --bg-color: #e0f7fa; /* Light Cyan */
            --panel-bg: #fff9c4; /* Pale Yellow */
            --header-bg: #81d4fa; /* Sky Blue */
            --accent-color: #ff4081; /* Hot Pink */
            --highlight-color: #ffd740; /* Amber */
            --text-color: #37474f; /* Dark Blue Grey */
            --line-color: #90a4ae; /* Staff Lines */
            --border-width: 4px;
            --border-radius: 12px;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
            background-image: radial-gradient(#b2ebf2 15%, transparent 15%);
            background-position: 0 0;
            background-size: 24px 24px;
            /* Hide default cursor everywhere to use custom emoji cursor */
            cursor: none; 
        }

        /* Canvas keeps the custom emoji stamp — hide OS cursor there */
        canvas {
            cursor: none !important;
        }

        /* Interactive UI: show the cute hand (pointer) */
        button, .emoji-btn, .picker-item, .picker-tab, a,
        header, header *,
        .picker-popover, .picker-popover *,
        .modal-overlay button {
            cursor: pointer !important;
        }

        /* Text inputs: standard I-beam */
        input, textarea {
            cursor: text !important;
        }

        /* Modal backdrop / box: standard arrow */
        .modal-overlay, .modal-box, .modal-title {
            cursor: default !important;
        }

        /* Custom Cursor Container - STAMP TOOL LOOK */
        #customCursor {
            position: fixed;
            top: 0; 
            left: 0;
            width: 64px; 
            height: 64px;
            pointer-events: none; /* Let clicks pass through */
            z-index: 10000;
            transform: translate(-50%, -50%); /* Center image on mouse point */
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* No container visuals */
            background: transparent;
            border: none;
            
            /* Springy return */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, background 0.2s;
        }

        #customCursor img {
            width: 48px;
            height: 48px;
            /* No internal shadow, the block casts the shadow */
            filter: drop-shadow(8px 8px 0px rgba(0,0,0,0.2));
            will-change: transform;
        }

        /* Cursor Click Animation Class - PRESS DOWN */
        #customCursor.pressing {
            /* Significant shrink to simulate pressing into the screen */
            transform: translate(-50%, -50%) scale(0.75);
            /* Fast press down, no bounce */
            transition: transform 0.05s ease-out;
        }
        
        #customCursor.pressing img {
             /* Shadow collapses to simulate contact */
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
            transition: filter 0.05s ease-out;
        }

        /* Header */
        header {
            background: var(--header-bg);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: var(--border-width) solid var(--text-color);
            z-index: 20;
            flex-shrink: 0;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            flex-wrap: wrap; /* Allow wrapping on small screens */
        }

        h1 {
            margin: 0;
            font-size: 0.9rem; /* Adjusted font size */
            color: #fff;
            text-shadow: 3px 3px 0px var(--text-color);
            white-space: nowrap;
            letter-spacing: 1px;
            line-height: 1.4;
            /* Give it a little breathing room */
            margin-right: auto; 
            flex-shrink: 1; /* Allow shrinking if needed */
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            /* room so the icon's drop-shadow isn't clipped by overflow:hidden */
            padding: 0 4px 4px 0;
        }

        h1 img {
            width: 28px;
            height: 28px;
            margin-right: 12px;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.2));
        }

        .controls {
            display: flex;
            gap: 8px; /* Reduced gap */
            align-items: center;
            flex-wrap: wrap; /* Allow wrapping of buttons */
            justify-content: flex-end;
        }

        /* Buttons */
        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem; /* Smaller font */
            background-color: var(--accent-color);
            color: white;
            border: var(--border-width) solid var(--text-color);
            padding: 8px 12px; /* Reduced padding */
            cursor: pointer;
            border-radius: 30px; /* Pill shape for elegance */
            box-shadow: 3px 3px 0px var(--text-color);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1;
            white-space: nowrap;
        }

        /* Button Icons (Twemojis) */
        button img {
            width: 16px;
            height: 16px;
            pointer-events: none;
            display: block;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--text-color);
            filter: brightness(1.1);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--text-color);
        }
        
        button:focus, .emoji-btn:focus, .picker-item:focus {
            outline: none; /* Remove default outline */
            box-shadow: 0 0 0 3px rgba(255, 64, 129, 0.5), 4px 4px 0px var(--text-color); /* Custom focus ring + shadow */
        }

        /* Distinct Button Styles */
        button.play-btn {
            background-color: #4caf50; /* Green for go */
            padding: 10px 18px; 
            font-size: 0.65rem;
        }
        button.play-btn.playing {
            background-color: #f44336; /* Red for stop */
            box-shadow: 1px 1px 0px var(--text-color);
            transform: translate(2px, 2px);
        }

        button.action-btn {
            background-color: #ffffff;
            color: var(--text-color);
        }
        
        button.action-btn:hover {
            background-color: #f5f5f5;
        }
        
        button.secondary {
            background-color: #ab47bc; /* Purple */
            color: white;
        }

        /* Tempo */
        .tempo-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.4);
            padding: 6px 12px;
            border-radius: 30px;
            border: 2px solid var(--text-color);
        }
        
        /* Custom Icon Display for Tempo */
        .tempo-icon {
            width: 20px; 
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tempo-icon img {
            width: 100%;
            height: 100%;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 70px; /* Compact width */
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 6px;
            background: #fff;
            border: 2px solid var(--text-color);
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            background: var(--highlight-color);
            border: 2px solid var(--text-color);
            border-radius: 50%;
            margin-top: -6px;
            cursor: pointer;
            box-shadow: 1px 1px 0px var(--text-color);
        }

        /* Palette Bar */
        .palette-bar {
            background: var(--panel-bg);
            background: linear-gradient(to bottom, #fff9c4, #fff59d);
            padding: 15px 30px; 
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: var(--border-width) solid var(--text-color);
            flex-shrink: 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            min-height: 90px;
            position: relative;
            z-index: 15;
            overflow-x: auto; /* Allow scroll on very small screens */
        }

        /* Hide scrollbar for cleaner look but keep functionality */
        .palette-bar::-webkit-scrollbar {
            height: 6px;
        }
        .palette-bar::-webkit-scrollbar-thumb {
            background: var(--text-color);
            border-radius: 3px;
        }
        .palette-bar::-webkit-scrollbar-track {
            background: transparent;
        }

        .current-emoji-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            background: #fff;
            border: var(--border-width) solid var(--text-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .current-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.5rem;
            color: var(--text-color);
            text-transform: uppercase;
            white-space: nowrap;
            background: var(--highlight-color);
            padding: 4px 8px;
            border-radius: 4px;
            border: 2px solid var(--text-color);
        }

        .current-emoji-img {
            width: 42px;
            height: 42px;
            image-rendering: pixelated;
        }

        /* Palette Container */
        .palette-container {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            align-items: center;
            /* Use nowrap to force horizontal scroll if needed, keeps it in one line */
            flex-wrap: nowrap; 
            padding-right: 15px; /* Padding for end of scroll */
        }

        .emoji-btn {
            background: #fff;
            padding: 6px;
            border: 3px solid transparent; /* Invisible border for sizing */
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 14px;
            transition: all 0.1s ease;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            flex-shrink: 0;
            position: relative;
        }
        
        .emoji-btn img {
            width: 36px;
            height: 36px;
            pointer-events: none;
        }

        .emoji-btn:hover { 
            background: #fff; 
            transform: translateY(-3px);
            z-index: 5;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
        }
        
        .emoji-btn.active {
            background: var(--highlight-color);
            border: 3px solid var(--text-color);
            box-shadow: 4px 4px 0px var(--text-color);
            transform: translateY(-6px);
            z-index: 10;
        }

        /* Add Button */
        #openPickerBtn {
            background: #eceff1;
            border: 3px dashed #b0bec5;
            color: #78909c;
            box-shadow: none;
        }
        #openPickerBtn:hover {
            border-color: var(--text-color);
            background: #fff;
            transform: translateY(-2px);
        }
        
        /* Plus icon inside add button */
        #openPickerBtn img {
             width: 24px;
             height: 24px;
        }


        /* Custom Picker Popover */
        .picker-popover {
            position: absolute;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #fff;
            border: var(--border-width) solid var(--text-color);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .picker-popover.visible { display: flex; }

        /* Filter Tabs */
        .picker-tabs {
            display: flex;
            background: #fffde7;
            border-bottom: 2px solid var(--text-color);
            overflow-x: auto;
            padding: 5px;
            gap: 5px;
        }
        
        .picker-tab {
            padding: 8px 12px;
            font-size: 1.2rem; /* Emoji size */
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #fff;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .picker-tab img {
            width: 24px;
            height: 24px;
        }
        
        .picker-tab:hover {
            background: #fff9c4;
            transform: translateY(-2px);
        }
        
        .picker-tab.active {
            background: var(--highlight-color);
            border-color: var(--text-color);
            box-shadow: 2px 2px 0px var(--text-color);
        }

        .picker-header {
            background: var(--highlight-color);
            padding: 10px;
            border-bottom: 2px solid var(--text-color);
            font-size: 0.7rem;
            text-align: center;
            text-transform: uppercase;
            color: var(--text-color);
        }

        .picker-content {
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .picker-section {
            margin-bottom: 25px;
        }

        .picker-section.hidden {
            display: none;
        }

        .picker-section-title {
            font-size: 0.7rem;
            color: #78909c;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid #eceff1;
            padding-bottom: 5px;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 10px;
        }

        .picker-item {
            width: 45px;
            height: 45px;
            background: #fff;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .picker-item:hover {
            transform: scale(1.1);
            border-color: var(--text-color);
            background: #fffde7;
        }

        .picker-item img {
            width: 30px;
            height: 30px;
        }

        /* Confirmation Modal */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        
        .modal-overlay.hidden { display: none; }

        .modal-box {
            background: #fff;
            border: var(--border-width) solid var(--text-color);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: var(--text-color);
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .modal-actions button {
             border-radius: 8px;
             font-size: 0.8rem;
        }

        /* Textarea for Sharing */
        textarea {
            font-family: 'Press Start 2P', cursive;
            border: 2px solid var(--text-color);
            border-radius: 8px;
            padding: 10px;
            background: #e0f7fa;
            color: var(--text-color);
            resize: none;
        }
        textarea:focus {
            outline: 2px solid var(--accent-color);
            background: #fff;
        }

        /* Canvas Area */
        .canvas-wrapper {
            flex-grow: 1;
            position: relative;
            background: #ffffff;
            /* Keep cursor:none here to be doubly sure */
            cursor: none; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; 
        }

        .hidden { display: none !important; }

        /* Danger button (e.g. modal close) */
        button.danger {
            background-color: #e57373;
            color: #fff;
        }
        button.danger:hover { background-color: #ef5350; }

        /* Visually hidden but read by screen readers */
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Toast — used in place of alert() so the toy aesthetic holds on errors */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: #fff;
            color: var(--text-color);
            border: var(--border-width) solid var(--text-color);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 0.7rem;
            line-height: 1.5;
            max-width: 80vw;
            z-index: 500;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s;
            opacity: 0;
            pointer-events: none;
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #ffebee; border-color: #c62828; }
        .toast.success { background: #e8f5e9; border-color: #2e7d32; }

        /* Respect user motion / cursor preferences: show OS cursor again */
        @media (prefers-reduced-motion: reduce) {
            body, button, input, canvas, .emoji-btn, .picker-item, .picker-tab, a, textarea,
            .canvas-wrapper {
                cursor: auto !important;
            }
            #customCursor { display: none !important; }
            /* Disable elastic stamp / bounce animations as best we can */
            .modal-box { animation: none !important; }
        }

        @media (max-width: 800px) {
            header { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
            h1 { text-align: center; margin-right: 0; font-size: 0.8rem; white-space: normal; }
            .controls { justify-content: center; flex-wrap: wrap; gap: 10px; }
            .palette-bar { padding: 15px; overflow-x: auto; justify-content: flex-start; }
            .palette-container { justify-content: flex-start; flex-wrap: nowrap; }
            .tempo-control { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Custom Cursor Element -->
    <div id="customCursor"></div>

    <header>
        <h1><img src="emojio-icon.png" alt="Emojio" width="44" height="44" style="vertical-align:middle;border-radius:9px"> Emojio Paint Composer</h1>
        <div class="controls">
            <!-- Buttons now populated by JS with icons AND text -->
            <button id="playToggle" class="play-btn">
                <img id="playIcon" alt="play">
                <span id="playLabel">Play</span>
            </button>
            
            <button id="randomBtn" class="action-btn" title="Randomize Notes" aria-label="Randomize notes">
                 <img id="randomIcon" alt="random">
                 <span>Random</span>
            </button>
            <button id="clearBtn" class="action-btn" title="Clear All" aria-label="Clear all notes">
                 <img id="clearIcon" alt="clear">
                 <span>Clear</span>
            </button>
            <button id="shareBtn" class="action-btn" title="Share Song" aria-label="Share song">
                 <img id="shareIcon" alt="share">
                 <span>Share</span>
            </button>
            
            <div class="tempo-control">
                <!-- Programmatically filled with emoji icons -->
                <div id="tempoIconSlow" class="tempo-icon" aria-hidden="true"></div>
                <label for="tempo" class="sr-only">Tempo in beats per minute</label>
                <input type="range" id="tempo" min="60" max="180" value="100"
                       aria-label="Tempo" aria-valuemin="60" aria-valuemax="180" aria-valuenow="100">
                <div id="tempoIconFast" class="tempo-icon" aria-hidden="true"></div>
            </div>
        </div>
    </header>

    <div class="palette-bar">
        <div class="current-emoji-wrapper" id="currentEmojiContainer">
            <div class="current-label">Active</div>
            <!-- Img injected by JS -->
        </div>

        <div class="palette-container" id="emojiPalette">
            <!-- Dynamic Palette Buttons -->
            <button id="openPickerBtn" class="emoji-btn" aria-label="Open Sticker Picker">
                <!-- Img injected by JS -->
            </button>
        </div>
    </div>

    <!-- Custom Picker Popover -->
    <div id="pickerPopover" class="picker-popover">
        <div class="picker-tabs" id="pickerTabs">
            <!-- Tabs injected by JS -->
        </div>
        <div class="picker-header">Choose Your Sticker</div>
        <div class="picker-content" id="pickerContent">
            <!-- Sections injected by JS -->
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-title" id="modalText">Are you sure?</div>
            <div class="modal-actions">
                <button id="modalConfirmBtn" class="play-btn">Yes!</button>
                <button id="modalCancelBtn" class="action-btn">No</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-title" style="margin-bottom:10px;">Share Your Song</div>
            <p style="font-size:0.65rem; line-height:1.5; margin-bottom:15px; color: #555;">
              Copy this code to save or share your song. Paste a code below to load one.
            </p>

            <!-- Output (read-only) -->
            <textarea id="songCodeOutput" readonly style="width:100%; height:60px; font-size:0.6rem; margin-bottom:8px;"></textarea>

            <button id="copySongCodeBtn" class="play-btn" style="width:100%; margin-bottom:20px;">Copy Song Code</button>

            <!-- Input for loading -->
            <textarea id="songCodeInput" placeholder="Paste song code here..." style="width:100%; height:60px; font-size:0.6rem; margin-bottom:8px;"></textarea>

            <button id="loadSongCodeBtn" class="action-btn" style="width:100%; margin-bottom:12px;">Load Song From Code</button>

            <button id="closeShareModalBtn" class="danger" style="width:100%;">Close</button>
        </div>
    </div>

    <div class="canvas-wrapper" id="canvasContainer">
        <canvas id="musicCanvas" aria-label="Music canvas. Click or tap to place emoji notes on the staff."></canvas>
    </div>

    <!-- Screen-reader announcements for note add/remove etc. -->
    <div id="srLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Toast container (used in place of alert()) -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        /**
         * 1. CONFIGURATION & CONSTANTS
         */
        const GRID_COLS = 16; 
        const SCALE = [
            'G5', 'F5', 'E5', 'D5', 'C5', 'B4', 'A4', 'G4', 'F4', 'E4', 'D4', 'C4', 'B3', 'A3', 'G3'
        ];
        const GRID_ROWS = SCALE.length; 

        const COLORS = {
            bg: '#ffffff',
            staffLine: '#90a4ae', 
            beatLine: '#eceff1', 
            barLine: '#cfd8dc', 
            playhead: '#ff4081',
            clef: '#37474f'
        };

        const MAIN_STAFF_LINES = [1, 3, 5, 7, 9, 11, 13];

        const CATEGORIES = {
            "Faces 😀": ["😀", "😂", "😍", "😎", "😢", "😱", "😴", "😡", "🤔", "😘", "🤯", "😈", "🤗", "🥺", "🥳", "😇"],
            "Animals 🐾": ["🐶", "🐱", "🐷", "🐸", "🐔", "🦆", "🦁", "🐮", "🐦", "🐺", "🐗", "🦄", "🐰", "🐭", "🐻", "🐨", "🐯", "🐵", "🐢", "🐍", "🐝", "🐠", "🐬", "🐳", "🦋", "🦊", "🐴", "🐘", "🦉", "🐧", "🦅", "🦈"],
            "Music 🎵": ["🎹", "🥁", "🎸", "🎺", "🎻", "🎷", "🔔", "🎼", "🎤", "🎧", "🎵", "🎶", "📻"],
            "Vehicles 🚗": ["🚗", "✈️", "🚢", "🚓", "🚒", "🚑", "🚜", "🚁", "🚀", "🛸", "🤖", "👾", "🚂", "🚕", "🚌", "🏎️", "🏍️", "🚲", "⛵", "🚤"],
            "Characters 🧙": ["👶", "👻", "👽", "💩", "💀", "🤡", "👺", "👼", "🧛", "🧚", "🧜", "🧞", "🧟", "🦸", "🥷", "🎅", "👹"],
            "Food 🍕": ["🍕", "🍔", "🍎", "🍌", "🍓", "🍦", "🍩", "🍰", "🍪", "🍿", "🍉", "🍇", "☕", "🍣"],
            "Sports 🏀": ["⚽", "🏀", "🏈", "⚾", "🎾", "🏐", "⛳", "🏓", "🎳", "🏆", "🎯", "🎲"],
            "Nature 🌸": ["🌸", "❤️", "🌊", "⭐", "🔥", "🌈", "🍄", "🌵", "💡", "🌳", "☀️", "🌙", "⛄", "❄️", "⚡", "☁️"],
            "Objects 💎": ["💎", "🎁", "🎈", "📱", "🔑", "⏰", "⚙️"]
        };

        const ALL_EMOJIS = Object.values(CATEGORIES).flat();

        /**
         * 2. GLOBAL STATE
         */
        const state = {
            isPlaying: false,
            bpm: 100, 
            selectedEmoji: null, 
            palette: [], 
            notes: [], 
            audioContextStarted: false,
            currentStep: -1,
            mouseSpeed: 0 // Velocity tracking
        };

        const imageCache = {};
        const loadingImages = new Set();
        
        let needsRedraw = true;
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgDirty = true;

        /**
         * 3. DOM ELEMENTS (Defined early to avoid hoisting issues)
         */
        const canvas = document.getElementById('musicCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;

        const playToggle = document.getElementById('playToggle');
        const playIcon = document.getElementById('playIcon');
        const playLabel = document.getElementById('playLabel');
        const randomBtn = document.getElementById('randomBtn');
        const clearBtn = document.getElementById('clearBtn');
        const shareBtn = document.getElementById('shareBtn');
        const tempoInput = document.getElementById('tempo');
        const paletteContainer = document.getElementById('emojiPalette');
        const openPickerBtn = document.getElementById('openPickerBtn');
        const pickerPopover = document.getElementById('pickerPopover');
        const pickerContent = document.getElementById('pickerContent');
        const pickerTabs = document.getElementById('pickerTabs');
        const currentEmojiContainer = document.getElementById('currentEmojiContainer');
        
        // Modals
        const modalOverlay = document.getElementById('confirmModal');
        const modalText = document.getElementById('modalText');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        
        const shareModal = document.getElementById('shareModal');
        const songCodeOutput = document.getElementById('songCodeOutput');
        const songCodeInput = document.getElementById('songCodeInput');
        const copySongCodeBtn = document.getElementById('copySongCodeBtn');
        const loadSongCodeBtn = document.getElementById('loadSongCodeBtn');
        const closeShareModalBtn = document.getElementById('closeShareModalBtn');

        const customCursor = document.getElementById('customCursor');
        const header = document.querySelector('header');
        const srLive = document.getElementById('srLive');
        const toastEl = document.getElementById('toast');

        /**
         * 4. UTILITIES
         */
        function markDirty() {
            needsRedraw = true;
            wakeRenderLoop();
        }

        // Screen-reader announcer
        function announce(text) {
            if (!srLive) return;
            srLive.textContent = '';
            // Defer so SR picks up the change
            setTimeout(() => { srLive.textContent = text; }, 50);
        }

        // Toy-styled toast (replacement for alert())
        let toastTimer = null;
        function showToast(text, kind = '') {
            if (!toastEl) return;
            toastEl.textContent = text;
            toastEl.className = 'toast visible' + (kind ? ' ' + kind : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('visible');
            }, 2800);
        }

        // localStorage persistence — saves song so refresh doesn't lose it
        const STORAGE_KEY = 'emojio-composer-v1';
        let persistTimer = null;
        function persist() {
            // Debounced so rapid mutations don't thrash storage
            clearTimeout(persistTimer);
            persistTimer = setTimeout(() => {
                try {
                    const data = {
                        bpm: state.bpm,
                        palette: state.palette,
                        selectedEmoji: state.selectedEmoji,
                        notes: state.notes.map(n => ({
                            emoji: n.emoji, gridX: n.gridX, gridY: n.gridY
                        }))
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) { /* private mode / full disk — ignore */ }
            }, 250);
        }
        function loadPersisted() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.notes)) return null;
                return data;
            } catch (e) { return null; }
        }

        // Simple undo stack (Cmd/Ctrl+Z)
        const UNDO_LIMIT = 50;
        const undoStack = [];
        function snapshotForUndo() {
            undoStack.push({
                bpm: state.bpm,
                palette: state.palette.slice(),
                selectedEmoji: state.selectedEmoji,
                notes: state.notes.map(n => ({
                    emoji: n.emoji, gridX: n.gridX, gridY: n.gridY, rotation: n.rotation
                }))
            });
            if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        }
        function undo() {
            if (!undoStack.length) {
                showToast("Nothing to undo");
                return;
            }
            const prev = undoStack.pop();
            state.bpm = prev.bpm;
            state.palette = prev.palette;
            state.notes = prev.notes.map(n => ({ ...n, createdAt: Date.now() }));
            tempoInput.value = state.bpm;
            if (typeof Tone !== "undefined" && Tone.Transport) {
                Tone.Transport.bpm.value = state.bpm;
            }
            selectEmoji(prev.selectedEmoji || state.palette[0]);
            renderPalette();
            persist();
            markDirty();
            announce("Undone");
        }

        function getEmojiUrl(emoji) {
            const codePoints = Array.from(emoji).map(c => c.codePointAt(0).toString(16))
                .filter(cp => cp !== 'fe0f') // Strip variation selectors for Twemoji compatibility
                .join('-');
            return `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/${codePoints}.png`;
        }

        function loadEmojiImage(emoji) {
            if (imageCache[emoji] || loadingImages.has(emoji)) return;
            loadingImages.add(emoji);
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = getEmojiUrl(emoji);
            img.onload = () => {
                imageCache[emoji] = img;
                loadingImages.delete(emoji);
                markDirty();
            };
            img.onerror = () => { loadingImages.delete(emoji); };
        }
        
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        /**
         * 5. DATA ENCODING / DECODING
         */
        function encodeSongObject(obj) {
            const json = JSON.stringify(obj);
            const utf8 = encodeURIComponent(json);
            const binary = utf8.replace(/%([0-9A-F]{2})/g, (_, p1) =>
                String.fromCharCode(parseInt(p1, 16))
            );
            return btoa(binary); 
        }

        function decodeSongObject(code) {
            const binary = atob(code);
            const utf8 = binary.split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join('');
            const json = decodeURIComponent(utf8);
            return JSON.parse(json);
        }

        function getSharableSong() {
            return {
                v: 1,
                bpm: state.bpm,
                palette: state.palette.slice(), 
                notes: state.notes.map(note => ({
                    p: state.palette.indexOf(note.emoji),
                    x: note.gridX,
                    y: note.gridY,
                    e: state.palette.indexOf(note.emoji) === -1 ? note.emoji : undefined
                }))
            };
        }

        function generateSongCode() {
            const song = getSharableSong();
            return encodeSongObject(song);
        }

        function loadSongFromCode(code) {
            let data;
            try {
                data = decodeSongObject(code.trim());
            } catch (err) {
                showToast("That song code doesn't look right. Try again.", "error");
                return false;
            }

            if (!data || typeof data !== 'object' || !Array.isArray(data.notes)) {
                showToast("This song code is from an unknown version.", "error");
                return false;
            }

            snapshotForUndo();

            // Apply to state
            state.bpm = data.bpm || 100;
            state.palette = Array.isArray(data.palette) && data.palette.length
                ? data.palette
                : state.palette;

            state.notes = data.notes.map(n => {
                let emoji = null;
                if (typeof n.p === 'number' && n.p >= 0 && n.p < state.palette.length) {
                    emoji = state.palette[n.p];
                } else if (n.e) {
                    emoji = n.e;
                } else {
                    emoji = state.palette[0];
                }

                // Preload image
                loadEmojiImage(emoji);

                return {
                    emoji,
                    gridX: n.x,
                    gridY: n.y,
                    createdAt: Date.now()
                };
            });

            // Sync UI
            tempoInput.value = state.bpm;
            if (typeof Tone !== "undefined" && Tone.Transport) {
                Tone.Transport.bpm.value = state.bpm;
            }

            // Preserve current selection if it still exists in the new palette
            const keepSelection = state.selectedEmoji && state.palette.includes(state.selectedEmoji);
            selectEmoji(keepSelection ? state.selectedEmoji : (state.palette[0] || state.selectedEmoji));
            renderPalette();
            persist();
            announce(`Loaded song with ${state.notes.length} notes`);
            // Force redraw immediately
            markDirty();
            return true;
        }

        /**
         * 6. AUDIO ENGINE
         */
        const instruments = {};
        const foley = {}; // UI Sounds
        let renderLoopRunning = false;
        let masterBus = null;

        function getMasterBus() {
            if (masterBus) return masterBus;
            const limiter = new Tone.Limiter(-2).toDestination();
            const reverb = new Tone.Reverb({ decay: 1.2, wet: 0.2 }).connect(limiter);
            masterBus = new Tone.Compressor({
                ratio: 3,
                threshold: -18,
                attack: 0.003,
                release: 0.1
            }).connect(reverb);
            return masterBus;
        }

        function getInstrument(type) {
            if (instruments[type]) return instruments[type];
            
            const bus = getMasterBus();
            // Global maxPolyphony limit for performance
            const polyOptions = { maxPolyphony: 4 };

            switch (type) {
                case 'dog': {
                    // Bark — sharp attack, fast filter pop for the "woof" formant
                    instruments.dog = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.003, decay: 0.09, sustain: 0.0, release: 0.06 }, filter: { Q: 6, type: "lowpass", rolloff: -24 }, filterEnvelope: { attack: 0.005, decay: 0.07, sustain: 0, release: 0.05, baseFrequency: 220, octaves: 3.5 } }).connect(bus);
                    instruments.dog.volume.value = -4;
                    break;
                }
                case 'howl': {
                    // Wolf howl — long sustained sawtooth with slow vibrato + gentle filter rise/fall
                    const howlVib = new Tone.Vibrato(3.5, 0.18).connect(bus);
                    instruments.howl = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.18, decay: 0.25, sustain: 0.7, release: 0.55 }, filter: { Q: 5, type: "bandpass" }, filterEnvelope: { attack: 0.25, decay: 0.4, sustain: 0.5, release: 0.5, baseFrequency: 400, octaves: 1.3 } }).connect(howlVib);
                    instruments.howl.volume.value = -7;
                    break;
                }
                case 'cat': {
                    // Meow — vocal bandpass with a quick vibrato wobble for the "me-ow" feel
                    const catVib = new Tone.Vibrato(6, 0.08).connect(bus);
                    instruments.cat = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "triangle" }, envelope: { attack: 0.04, decay: 0.22, sustain: 0.35, release: 0.4 }, filter: { Q: 5, type: "bandpass" }, filterEnvelope: { attack: 0.06, decay: 0.25, sustain: 0.55, release: 0.3, baseFrequency: 700, octaves: 1.6 } }).connect(catVib);
                    instruments.cat.volume.value = -6;
                    break;
                }
                case 'pig': {
                    // Oink / snort — nasal mid-low burst with bandpass and resonance
                    instruments.pig = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.005, decay: 0.13, sustain: 0.0, release: 0.09 }, filter: { Q: 4.5, type: "bandpass" }, filterEnvelope: { attack: 0.01, decay: 0.11, sustain: 0, release: 0.08, baseFrequency: 180, octaves: 1.6 } }).connect(bus);
                    instruments.pig.volume.value = -5;
                    break;
                }
                case 'baby':
                    instruments.baby = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "pulse", width: 0.4 }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.2 }, filter: { Q: 5, type: "bandpass" }, filterEnvelope: { attack: 0.1, decay: 0.2, sustain: 0.2, baseFrequency: 400, octaves: 2 } }).connect(bus);
                    instruments.baby.volume.value = -8;
                    break;
                case 'plane':
                    const planeTrem = new Tone.Tremolo(9, 0.75).start().connect(bus);
                    instruments.plane = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "fatsawtooth", count: 2, spread: 20 }, envelope: { attack: 0.1, decay: 0.2, sustain: 0.8, release: 0.1 }, detune: -1200 }).connect(planeTrem);
                    instruments.plane.volume.value = -12;
                    break;
                case 'boat':
                    const boatTrem = new Tone.Tremolo(4, 0.5).start().connect(bus);
                    instruments.boat = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "square" }, envelope: { attack: 0.1, decay: 0.2, sustain: 1, release: 0.2 } }).connect(boatTrem);
                    instruments.boat.volume.value = -10;
                    break;
                case 'flower':
                    instruments.flower = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3.01, modulationIndex: 2, oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.3 }, modulation: { type: "sine" }, modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.3 } }).connect(bus);
                    instruments.flower.volume.value = -5;
                    break;
                case 'mario': {
                    // Piano-ish — sharp transient, long decay, almost no sustain (like a real piano)
                    instruments.mario = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "triangle" }, envelope: { attack: 0.002, decay: 0.8, sustain: 0.05, release: 0.4 } }).connect(bus);
                    instruments.mario.volume.value = -3;
                    break;
                }
                case 'gameboy':
                    const crusher = new Tone.BitCrusher(4);
                    const gbFilter = new Tone.Filter(3000, "lowpass").connect(bus);
                    crusher.connect(gbFilter);
                    instruments.gameboy = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 } }).connect(crusher);
                    instruments.gameboy.volume.value = -8;
                    break;
                case 'car':
                    const hornFilter = new Tone.Filter(2000, "lowpass").connect(bus);
                    instruments.car = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.02, decay: 0.2, sustain: 0.5, release: 0.2 }, }).connect(hornFilter);
                    instruments.car.volume.value = -10;
                    break;
                case 'drum':
                    instruments.drum = new Tone.PolySynth(Tone.MembraneSynth, { ...polyOptions, pitchDecay: 0.05, octaves: 4, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.01, release: 0.2 } }).connect(bus);
                    instruments.drum.volume.value = -2;
                    break;
                case 'ghost':
                    const ghostVib = new Tone.Vibrato(6, 0.3).connect(bus);
                    instruments.ghost = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sine" }, envelope: { attack: 0.1, decay: 0.5, sustain: 1, release: 0.3 }, filter: { Q: 0, type: "lowpass", rolloff: -12 }, }).connect(ghostVib);
                    instruments.ghost.volume.value = -8;
                    break;
                case 'frog': {
                    // Ribbit — throaty pulse with sharp bandpass at low-mid for the "rrr" body
                    instruments.frog = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "pulse", width: 0.65 }, envelope: { attack: 0.005, decay: 0.18, sustain: 0.0, release: 0.1 }, filter: { Q: 8, type: "bandpass", rolloff: -12 }, filterEnvelope: { attack: 0.02, decay: 0.18, sustain: 0, release: 0.1, baseFrequency: 220, octaves: 1.1 } }).connect(bus);
                    instruments.frog.volume.value = -5;
                    break;
                }
                case 'brass': {
                    const brassFilter = new Tone.Filter(2500, "lowpass").connect(bus);
                    instruments.brass = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.05, decay: 0.1, sustain: 0.7, release: 0.2 } }).connect(brassFilter);
                    instruments.brass.volume.value = -8;
                    break;
                }
                case 'strings':
                    const stringVib = new Tone.Vibrato(4, 0.2).connect(bus);
                    instruments.strings = new Tone.PolySynth(Tone.Synth, { ...polyOptions, oscillator: { type: "pwm", modulationFrequency: 5 }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.0, release: 0.3 } }).connect(stringVib);
                    instruments.strings.volume.value = -10;
                    break;
                case 'cluck': {
                    // Chicken "bok" — very short narrow-pulse pop with mid-high bandpass
                    instruments.cluck = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "pulse", width: 0.15 }, envelope: { attack: 0.002, decay: 0.07, sustain: 0, release: 0.04 }, filter: { Q: 8, type: "bandpass" }, filterEnvelope: { attack: 0.005, decay: 0.07, sustain: 0, release: 0.04, baseFrequency: 750, octaves: 1.4 } }).connect(bus);
                    instruments.cluck.volume.value = -5;
                    break;
                }
                case 'quack': {
                    // Duck — nasal blat with resonant downward sweep
                    instruments.quack = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.015, decay: 0.18, sustain: 0.25, release: 0.15 }, filter: { Q: 10, type: "bandpass" }, filterEnvelope: { attack: 0.02, decay: 0.2, sustain: 0.3, release: 0.15, baseFrequency: 650, octaves: -0.6 } }).connect(bus);
                    instruments.quack.volume.value = -6;
                    break;
                }
                case 'moo': {
                    // Cow — long, throaty, slight upward formant then sustained body
                    instruments.moo = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.08, decay: 0.5, sustain: 0.55, release: 0.4 }, filter: { Q: 3.5, type: "lowpass" }, filterEnvelope: { attack: 0.15, decay: 0.4, sustain: 0.35, release: 0.4, baseFrequency: 130, octaves: 1.2 } }).connect(bus);
                    instruments.moo.volume.value = -5;
                    break;
                }
                case 'chirp': {
                    // Bird tweet — short bright FM blip with quick mod decay (chirp shape)
                    instruments.chirp = new Tone.PolySynth(Tone.FMSynth, { ...polyOptions, harmonicity: 3, modulationIndex: 9, oscillator: { type: "sine" }, envelope: { attack: 0.003, decay: 0.08, sustain: 0, release: 0.05 }, modulation: { type: "triangle" }, modulationEnvelope: { attack: 0.003, decay: 0.06, sustain: 0, release: 0.05 } }).connect(bus);
                    instruments.chirp.volume.value = -5;
                    break;
                }
                case 'lion': {
                    // Roar — distorted sawtooth + slow tremolo for growl + low base
                    const lionDist = new Tone.Distortion(0.55).connect(bus);
                    const lionGrowl = new Tone.Tremolo(7, 0.4).start().connect(lionDist);
                    instruments.lion = new Tone.PolySynth(Tone.MonoSynth, { ...polyOptions, oscillator: { type: "sawtooth" }, envelope: { attack: 0.06, decay: 0.3, sustain: 0.8, release: 0.4 }, filter: { Q: 2, type: "lowpass" }, filterEnvelope: { attack: 0.08, decay: 0.3, sustain: 0.55, release: 0.4, baseFrequency: 80, octaves: 2.6 } }).connect(lionGrowl);
                    instruments.lion.volume.value = -5;
                    break;
                }
                case 'alien':

                        instruments.default.volume.value = -3;
                    }
                    return instruments.default;

        async function initAudio() {
            if (state.audioContextStarted) return;
            if (typeof Tone === "undefined") {
                console.warn("Tone.js not available.");
                return;
            }
            try { await Tone.start(); } catch (e) { console.error("Audio init failed", e); return; }
            state.audioContextStarted = true;

            // Foley/UI Sounds (create once)
            foley.thunk = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, envelope: { attack: 0.001, decay: 0.1, sustain: 0 } }).toDestination();
            foley.thunk.volume.value = -10;
            foley.foop = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 1, envelope: { attack: 0.01, decay: 0.2, sustain: 0 } }).toDestination();
            foley.foop.volume.value = -8;

            setupTransport();
        }

        let transportStep = 0;

        function setupTransport() {
            Tone.Transport.cancel();
            transportStep = 0;
            Tone.Transport.scheduleRepeat((time) => {
                state.currentStep = transportStep % GRID_COLS;
                transportStep++;
                
                // Redraw on beat
                markDirty();
                
                const notesToPlay = state.notes.filter(n => n.gridX === state.currentStep);
                notesToPlay.forEach(note => playNote(note, time));
            }, "16n");
        }

        function triggerSound(type, pitch, duration, time, velocity = 1) {
            const vel = Math.min(1, Math.max(0.5, velocity));
            if (typeof Tone === "undefined") return;
            const inst = getInstrument(type);
            inst.triggerAttackRelease(pitch, duration, time, vel);
        }

            '💎': { synth: 'bell',   semi: 24 },   // diamond sparkle

            '🎈': { synth: 'splat',  semi: 12 },   // balloon pop

        };

        function getVoiceProfile(emoji) {
            return VOICES[emoji] || { synth: getSoundType(emoji) };
        }

        // Default sequence / preview durations per synth, used unless VOICES overrides.
        function getSequenceDuration(synth) {
            if (['flower', 'ghost', 'strings', 'boat', 'plane', 'moo', 'star', 'bell',
                 'angel', 'heart', 'headphones', 'howl', 'lion',
                 'fire', 'rocket', 'train', 'tractor',
                 'cry', 'hiss', 'buzz'].includes(synth)) return '4n';
            if (['cat', 'mario', 'brass', 'car', 'baby', 'quack', 'honk', 'sax',
                 'siren', 'alien', 'unicorn', 'mic', 'robot'].includes(synth)) return '8n';
            return '16n';
        }
        function getPreviewDuration(synth) {
            if (['flower', 'ghost', 'strings', 'boat', 'plane', 'moo', 'star', 'bell',
                 'angel', 'heart', 'headphones', 'mic', 'howl', 'lion',
                 'fire', 'rocket', 'train', 'tractor',
                 'cry', 'hiss', 'buzz'].includes(synth)) return '4n';
            if (['dog', 'pig', 'frog', 'drum', 'gameboy', 'cluck', 'chirp', 'wood',
                 'chopper', 'mushroom', 'ball', 'splat', 'bones',
                 'laugh', 'zap'].includes(synth)) return '16n';
            return '8n';
        }

        // Transpose a note ("C4") by N semitones. Returns Hz (number) which Tone accepts.
        function transposePitch(pitch, semitones) {
            if (!semitones) return pitch;
            if (typeof Tone === "undefined" || !Tone.Frequency) return pitch;
            try {
                return Tone.Frequency(pitch).transpose(semitones).toFrequency();
            } catch (e) { return pitch; }
        }

        function playNote(noteObj, time) {
            const profile = getVoiceProfile(noteObj.emoji);
            const basePitch = SCALE[noteObj.gridY];
            const pitch = transposePitch(basePitch, profile.semi || 0);
            const duration = profile.dur || getSequenceDuration(profile.synth);
            triggerSound(profile.synth, pitch, duration, time);
        }

        function playPreview(emoji) {
            if (typeof Tone === "undefined" || !Tone.context || Tone.context.state !== 'running') return;
            const profile = getVoiceProfile(emoji);
            const pitch = transposePitch("C4", profile.semi || 0);
            const duration = profile.previewDur || getPreviewDuration(profile.synth);
            const vel = Math.min(1, 0.6 + (state.mouseSpeed * 0.02));
            triggerSound(profile.synth, pitch, duration, Tone.now(), vel);
        }

        // Legacy fallback for emojis not in VOICES (older saved songs etc.)
        function getSoundType(emoji) {
            // Animals
            if (emoji.match(/🐶|🐕|🐩|🐺/)) return 'dog';
            if (emoji.match(/🦁|🐻|🐯/)) return 'lion';
            if (emoji.match(/🐱|🐈|🦄/)) return 'cat';
            if (emoji.match(/🐔|🐓|🐣/)) return 'cluck';
            if (emoji.match(/🦆|🦢/)) return 'quack';
            if (emoji.match(/🐦|🦅|🦉|🦜/)) return 'chirp';
            if (emoji.match(/🐷|🐖|🐗/)) return 'pig';
            if (emoji.match(/🐮|🐂|🐃/)) return 'moo';
            if (emoji.match(/🐸|🐢|🐊/)) return 'frog';
            
            // Characters
            if (emoji.match(/👶|🧒|🗣️/)) return 'baby';
            if (emoji.match(/👻|🧛/)) return 'ghost';
            if (emoji.match(/👽|👾|🤖/)) return 'alien';
            if (emoji.match(/💀|☠️/)) return 'wood';
            if (emoji.match(/🤡|👺/)) return 'honk';
            if (emoji.match(/💩/)) return 'pig'; 

            // Vehicles
            if (emoji.match(/✈️|🛩️/)) return 'plane';
            if (emoji.match(/🚁/)) return 'chopper';
            if (emoji.match(/🚀|🛸/)) return 'chopper'; 
            if (emoji.match(/🚢|🛳️|⛵/)) return 'boat';
            if (emoji.match(/🚓|🚒|🚑/)) return 'siren';
            if (emoji.match(/🚗|🚕|🚌|🏎️|🚜|🚂/)) return 'car';

            // Instruments
            if (emoji.match(/🎺|📯/)) return 'brass';
            if (emoji.match(/🎷/)) return 'sax';
            if (emoji.match(/🎻/)) return 'strings';
            if (emoji.match(/🎸/)) return 'pluck';
            if (emoji.match(/🎹|🎼|🎵|🎶/)) return 'mario';
            if (emoji.match(/🥁|💥|💣|🔨|👏/)) return 'drum';
            if (emoji.match(/🔔/)) return 'bell';
            if (emoji.match(/🎮|🕹️|📟/)) return 'gameboy';
            
            // Nature/Misc
            if (emoji.match(/⭐|🌟|✨|🌈|💡/)) return 'star';
            if (emoji.match(/🌸|🌺|🌻|🌼|🌷/)) return 'flower';
            if (emoji.match(/🌊|💧|🌧️/)) return 'water';
            if (emoji.match(/🔥/)) return 'chopper';

            return 'default';
        }

        /**
         * 7. VISUAL RENDERER
         */
        let stepX, stepY, staffPaddingLeft = 120; 

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            const rect = container.getBoundingClientRect();

            canvas.width = rect.width;
            canvas.height = rect.height;

            bgCanvas.width = rect.width;
            bgCanvas.height = rect.height;

            stepX = (canvas.width - staffPaddingLeft) / GRID_COLS;
            const marginY = 40;
            stepY = (canvas.height - (marginY * 2)) / (GRID_ROWS - 1);

            bgDirty = true;
            markDirty();
        }

        function drawBackground() {
            if (!bgDirty) return;
            bgDirty = false;

            const marginY = 40;
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            // Grid
            bgCtx.strokeStyle = '#e0f7fa';
            bgCtx.lineWidth = 1;
            for (let i = 0; i <= GRID_COLS; i++) {
                const x = staffPaddingLeft + i * stepX;
                bgCtx.beginPath();
                bgCtx.moveTo(x, 0);
                bgCtx.lineTo(x, bgCanvas.height);
                bgCtx.stroke();
            }

            // Staff
            bgCtx.lineCap = "round";
            for (let i = 0; i < GRID_ROWS; i++) {
                if (i % 2 !== 0) {
                    const y = marginY + i * stepY;
                    const isMain = MAIN_STAFF_LINES.includes(i);
                    bgCtx.strokeStyle = isMain ? COLORS.staffLine : '#eceff1';
                    bgCtx.lineWidth = isMain ? 4 : 2;
                    bgCtx.beginPath();
                    bgCtx.moveTo(20, y);
                    bgCtx.lineTo(bgCanvas.width - 20, y);
                    bgCtx.stroke();
                }
            }

            // Clef
            bgCtx.fillStyle = COLORS.clef;
            bgCtx.font = `${stepY * 14}px serif`;
            bgCtx.textAlign = "center";
            bgCtx.textBaseline = "alphabetic";
            const g4Y = marginY + 7 * stepY;
            bgCtx.fillText("𝄞", staffPaddingLeft / 2.5, g4Y + (stepY * 4.5));
        }

        // Render loop sleeps when idle and is woken via markDirty()/wakeRenderLoop().
        // Saves battery on mobile vs. an always-on rAF.
        //
        // Wake sources:
        //   - User input that changes notes/palette -> markDirty()
        //   - Tone.Transport tick -> markDirty() (so the playhead moves)
        //   - draw() sets needsRedraw=true while a stamp/bounce animation is in progress,
        //     which keeps the loop alive frame-to-frame.
        function wakeRenderLoop() {
            if (renderLoopRunning) return;
            renderLoopRunning = true;

            function loop() {
                if (needsRedraw) {
                    needsRedraw = false;
                    draw(state.currentStep);
                }
                if (needsRedraw) {
                    requestAnimationFrame(loop);
                } else {
                    renderLoopRunning = false;
                }
            }
            requestAnimationFrame(loop);
        }
        // Compat alias kept in case anything else calls startRenderLoop
        const startRenderLoop = wakeRenderLoop;

        function draw(playheadIndex) {
            // Guard against 0-size canvas which causes InvalidStateError in drawImage
            if (canvas.width === 0 || canvas.height === 0 || bgCanvas.width === 0 || bgCanvas.height === 0) return;

            drawBackground();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgCanvas, 0, 0);

            const marginY = 40;

            // Playhead
            if (state.isPlaying && playheadIndex >= 0) {
                const x = staffPaddingLeft + playheadIndex * stepX;
                ctx.fillStyle = 'rgba(255, 64, 129, 0.1)'; 
                ctx.fillRect(x, 0, stepX, canvas.height);
                ctx.strokeStyle = COLORS.playhead;
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(x + stepX/2, 0); ctx.lineTo(x + stepX/2, canvas.height); ctx.stroke();
            }

            // Notes
            const now = Date.now();
            let animateNextFrame = false;

            state.notes.forEach(note => {
                const x = staffPaddingLeft + note.gridX * stepX;
                const y = marginY + note.gridY * stepY;
                const isPlaying = playheadIndex === note.gridX && state.isPlaying;

                const size = stepY * 1.9; 
                const cx = x + stepX / 2;
                const cy = y;

                const img = imageCache[note.emoji];
                
                ctx.save();
                ctx.translate(cx, cy);

                // Imperfection: Random Rotation
                if (note.rotation === undefined) note.rotation = (Math.random() - 0.5) * 0.3;
                ctx.rotate(note.rotation);

                if (isPlaying) {
                    // Bounce
                    const bounceSpeed = 0.015;
                    const bounce = Math.abs(Math.sin(now * bounceSpeed)) * 15;
                    ctx.translate(0, -bounce);
                    ctx.scale(1.2, 1.2);
                    ctx.rotate(Math.sin(now * 0.02) * 0.2); 
                    ctx.shadowColor = "rgba(255, 64, 129, 0.6)"; ctx.shadowBlur = 20;
                    animateNextFrame = true;
                } else if (note.isPressed) {
                     // Pressed state: Squished
                     ctx.scale(0.8, 0.8);
                     ctx.shadowColor = "rgba(55, 71, 79, 0.5)"; 
                     ctx.shadowBlur = 2; 
                     ctx.shadowOffsetY = 1;
                } else if (note.createdAt && (now - note.createdAt < 400)) {
                    // Elastic Stamp Animation
                    const age = now - note.createdAt;
                    const t = age / 400; 
                    // Overshoot easeOutElastic-ish
                    let scale = 1;
                    if (t < 0.5) { // Expand
                       scale = 0.5 + (t * 2) * 0.7; // 0.5 -> 1.2
                    } else { // Settle
                       scale = 1.2 - ((t-0.5) * 2) * 0.2; // 1.2 -> 1.0
                    }
                    ctx.scale(scale, scale);
                    ctx.shadowColor = "rgba(55, 71, 79, 0.3)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
                    animateNextFrame = true;
                } else {
                    // Draw Fake Shadow for static notes (performance optimization)
                    // We draw the image again, offset, with low opacity.
                    // This avoids setting expensive shadowBlur properties.
                }

                if (img) {
                     // Manual Shadow for static notes (faster than ctx.shadow)
                    if (!isPlaying && !note.isPressed && (!note.createdAt || now - note.createdAt >= 400)) {
                         ctx.globalAlpha = 0.2;
                         ctx.drawImage(img, -size/2 + 2, -size/2 + 4, size, size); // Offset shadow
                         ctx.globalAlpha = 1.0;
                    }
                    ctx.drawImage(img, -size/2, -size/2, size, size);
                } else {
                    ctx.fillStyle = '#37474f';
                    ctx.font = `${size}px "Segoe UI Emoji", serif`; 
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(note.emoji, 0, 0);
                    loadEmojiImage(note.emoji);
                }
                ctx.restore();
            });

            if (animateNextFrame) {
                needsRedraw = true; // Keep loop going if animating
            }
        }

        /**
         * 8. INTERACTION & EVENTS
         */
        
        // Buttons with Icons
        const btnConfigs = [
            { id: 'randomIcon', emoji: '🎲' },
            { id: 'clearIcon', emoji: '🗑️' },
            { id: 'shareIcon', emoji: '✉️' },
            { id: 'playIcon', emoji: '▶️' } // Initial state
        ];

        btnConfigs.forEach(conf => {
            const img = document.getElementById(conf.id);
            if(img) img.src = getEmojiUrl(conf.emoji);
        });
        
        // Populate Tempo Icons
        const tempoIconSlow = document.getElementById('tempoIconSlow');
        const tempoIconFast = document.getElementById('tempoIconFast');
        const slowImg = document.createElement('img'); slowImg.src = getEmojiUrl('🐢'); tempoIconSlow.appendChild(slowImg);
        const fastImg = document.createElement('img'); fastImg.src = getEmojiUrl('🐇'); tempoIconFast.appendChild(fastImg);

        let pendingAction = null;
        let lastMouseX = 0, lastMouseY = 0, lastMouseTime = 0;

        // Custom Cursor & Velocity Tracking
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;

        // Pointer events cover mouse + touch + pen. Listener is passive so the OS
        // can keep scrolling smooth even though we sample on every move.
        document.addEventListener('pointermove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;

            // Velocity, time-normalized (px/ms scaled to a feel-good range)
            const now = e.timeStamp || performance.now();
            const dt = Math.max(1, now - lastMouseTime);
            if (dt > 16) {
                const dist = Math.hypot(e.clientX - lastMouseX, e.clientY - lastMouseY);
                // ~0 at idle, ~1.5 at fast flick — scaled so playPreview's `0.6 + speed*0.02`
                // remains in a sensible range without overshooting.
                state.mouseSpeed = Math.min(20, (dist / dt) * 10);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                lastMouseTime = now;
            }
        }, { passive: true });

        function animateCursor() {
            if(customCursor) {
                customCursor.style.transform = `translate(${cursorX - 32}px, ${cursorY - 32}px)`; // 64px / 2
            }
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Use pointer events to handle hold-to-press behavior robustly (compatible with mouse/touch/pen)
        // This ensures the cursor visually "presses" and "releases" regardless of where the click occurs.
        const togglePress = (force) => customCursor.classList.toggle('pressing', force);
        document.addEventListener('pointerdown', () => togglePress(true));
        
        // Handle RELEASE logic for stamps
        document.addEventListener('pointerup', () => {
            togglePress(false);
            // Release all pressed notes
            const now = Date.now();
            let changed = false;
            state.notes.forEach(n => {
                if (n.isPressed) {
                    n.isPressed = false;
                    n.createdAt = now; // Trigger animation start
                    changed = true;
                }
            });
            if (changed) markDirty();
        });
        document.addEventListener('pointercancel', () => togglePress(false));


        // Hide the emoji stamp cursor over UI chrome (buttons, dialogs, picker, header)
        // so the underlying OS pointer ("cute hand") shows through instead.
        const UI_SELECTOR = 'button, input, textarea, a, .emoji-btn, .picker-item, .picker-tab, .picker-popover, .modal-overlay, header';
        document.addEventListener('pointerover', (e) => {
            const overUI = e.target && e.target.closest && e.target.closest(UI_SELECTOR);
            customCursor.style.opacity = overUI ? '0' : '1';
        });

        // Hide the custom cursor when the pointer leaves the page or window loses focus.
        document.addEventListener('mouseleave', () => customCursor.style.opacity = '0');
        document.addEventListener('mouseenter', () => customCursor.style.opacity = '1');
        window.addEventListener('blur', () => customCursor.style.opacity = '0');
        window.addEventListener('focus', () => customCursor.style.opacity = '1');

        // Modal
        function showModal(text, onConfirm) {
            modalText.textContent = text;
            pendingAction = onConfirm;
            modalOverlay.classList.remove('hidden');
        }
        function hideModal() { modalOverlay.classList.add('hidden'); pendingAction = null; }
        modalConfirmBtn.onclick = () => { if (pendingAction) pendingAction(); hideModal(); }
        modalCancelBtn.onclick = hideModal;

        // --- SHARE MODAL LOGIC ---
        function openShareModal() {

            // Reflect the song in the URL hash so the page URL itself is shareable.

            shareModal.classList.remove('hidden');
        }
        function closeShareModal() { shareModal.classList.add('hidden'); }
        
        shareBtn.addEventListener('click', openShareModal);
        closeShareModalBtn.addEventListener('click', closeShareModal);
