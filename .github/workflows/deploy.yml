name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Publish ONLY the web app, not the whole repo (which now also holds the
      # Flutter app/ and tools/). index.html + emojio-icon.png are its only files.
      - name: Assemble web app
        run: |
          mkdir -p _site
          cp index.html emojio-icon.png _site/
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=emojio-paint-composer
